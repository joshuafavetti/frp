services:
  frps:
    build:
      context: ..
      target: frps
    image: frps:0.71.1
    container_name: frps
    restart: unless-stopped

    # Runtime hardening
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

    environment:
      FRP_TOKEN: ${FRP_TOKEN:?set FRP_TOKEN in .env}

    volumes:
      # Long syntax: fail clearly if a path is missing instead of
      # silently creating an empty directory in its place.
      - type: bind
        source: ./frps.toml
        target: /etc/frp/frps.toml
        read_only: true
      - type: bind
        source: ./tls
        target: /etc/frp/tls
        read_only: true

    ports:
      - "7000:7000"
      # Only publish remote ports you actually use (must be within allowPorts).
      # With stcp proxies, nothing beyond 7000 needs to be published.
      # - "6000:6000"

    # To join Nginx Proxy Manager's network, enable compose.npm.yaml via
    # COMPOSE_FILE in .env (see README "Websites via Nginx Proxy Manager").

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
